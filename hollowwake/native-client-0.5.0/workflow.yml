name: Hollowwake native client 0.5 test package
on:
  push:
    branches: ['hollowwake/native-system-route']
    paths: ['hollowwake/native-client-0.5.0/**', 'hollowwake/client-runtime/graphics/**', 'hollowwake/runtime-native-route/**', '.github/workflows/hollowwake-native-client-050.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build separate native-route package and focused production checks
        id: public_build
        if: ${{ !(contains(github.event.head_commit.message, '[audio-only]') || contains(github.event.head_commit.message, '[providers-only]')) }}
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64
          powershell -NoProfile -File hollowwake\native-client-0.5.0\Build.ps1 -OutputDirectory "%GITHUB_WORKSPACE%\artifacts\native-client-050"
      - name: Compile runtime only for focused audio iteration
        if: ${{ contains(github.event.head_commit.message, '[audio-only]') || contains(github.event.head_commit.message, '[providers-only]') }}
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64
          msbuild hollowwake\native-client-0.5.0\Native\Native.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=false /nologo
      - name: Compile reviewed DirectSound and UWP OpenAL candidate
        id: audio_candidate
        if: ${{ always() && contains(github.event.head_commit.message, '[audio-uwp]') }}
        continue-on-error: true
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64
          powershell -NoProfile -File hollowwake\native-client-0.5.0\audio\Build-Audio.ps1 -OutputDirectory "%GITHUB_WORKSPACE%\artifacts\native-client-050\audio"
          if not exist "%GITHUB_WORKSPACE%\artifacts\native-client-050\audio\audio-build.json" exit /b 1
      - name: Exercise actual audio providers inside owned UWP package
        id: audio_behavior
        if: ${{ steps.audio_candidate.outcome == 'success' && steps.public_build.outcome == 'success' }}
        continue-on-error: true
        shell: powershell
        run: ./hollowwake/native-client-0.5.0/audio/Test-AudioPackage.ps1 -ProviderDirectory artifacts/native-client-050/audio -OutputDirectory artifacts/native-client-050
      - name: Compile reviewed Mesa UWP WGL candidate
        id: mesa_candidate
        if: ${{ always() && contains(github.event.head_commit.message, '[mesa-uwp]') }}
        continue-on-error: true
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64
          powershell -NoProfile -File hollowwake\native-client-0.5.0\mesa\Build-Mesa.ps1 -OutputDirectory "%GITHUB_WORKSPACE%\artifacts\native-client-050\mesa"
          if not exist "%GITHUB_WORKSPACE%\artifacts\native-client-050\mesa\mesa-build.json" exit /b 1
      - name: Preserve licensed provider candidates and corresponding source
        if: ${{ always() && (steps.audio_candidate.outcome == 'success' || steps.mesa_candidate.outcome == 'success') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hollowwake-licensed-provider-candidates
          path: |
            artifacts/native-client-050/audio/
            artifacts/native-client-050/mesa/
          retention-days: 3
      - name: Verify supplied Neo VCLibs without installing or executing it
        id: neo_dependency
        continue-on-error: true
        shell: powershell
        run: |
          ./hollowwake/native-client-0.5.0/tests/Test-NeoDependency.ps1 -OutputDirectory artifacts/native-client-050
      - name: Build full private integrated client and bundled content
        id: full_content
        if: ${{ contains(github.event.head_commit.message, '[full-content]') }}
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64
          powershell -NoProfile -File hollowwake\native-client-0.5.0\private-package\Build-FullContent.ps1 -EvidenceDirectory "%GITHUB_WORKSPACE%\artifacts\native-client-050"
      - name: Encrypt full private MSIX and dependencies for the recipient
        id: full_encrypt
        if: ${{ steps.full_content.outcome == 'success' }}
        shell: pwsh
        run: |
          ./hollowwake/native-client-0.5.0/private-package/Export-EncryptedFull.ps1 -ResultFile './artifacts/native-client-050/full-content-result.json' -OutputDirectory "$env:RUNNER_TEMP/HollowwakeFullEncryptedDelivery" -RecipientPublicKey './hollowwake/native-client-0.5.0/private-package/delivery-recipient-public.pem'
      - name: Install pinned artifact delivery SDK
        if: ${{ steps.full_encrypt.outcome == 'success' }}
        shell: pwsh
        run: npm ci --ignore-scripts --prefix hollowwake/native-client-0.5.0/private-package/delivery-tools
      - name: Publish bounded recipient-encrypted full delivery
        id: bounded_delivery
        continue-on-error: true
        if: ${{ steps.full_encrypt.outcome == 'success' }}
        uses: ./hollowwake/native-client-0.5.0/private-package/delivery-tools
        with:
          directory: ${{ runner.temp }}/HollowwakeFullEncryptedDelivery
          prefix: hollowwake-full-private
      - name: Preserve encrypted full delivery if bounded export fails
        if: ${{ steps.full_encrypt.outcome == 'success' && steps.bounded_delivery.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hollowwake-full-private-monolithic-fallback
          path: ${{ runner.temp }}/HollowwakeFullEncryptedDelivery/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Private game-input packaging check; never upload its files
        id: private_source
        if: ${{ !contains(github.event.head_commit.message, '[ui-only]') && !contains(github.event.head_commit.message, '[no-private-inputs]') }}
        timeout-minutes: 18
        continue-on-error: true
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64
          python hollowwake\native-client-0.5.0\tests\CodePrefixTest.py
          if errorlevel 1 exit /b 1
          python -m pip install --disable-pip-version-check pefile==2024.8.26
          python -u hollowwake\native-client-0.5.0\private-package\fetch_inputs.py hollowwake\native-client-0.5.0\App\boot-inputs.json "%RUNNER_TEMP%\HollowwakePrivateInputs"
          if errorlevel 1 exit /b 1
          python hollowwake\native-client-0.5.0\private-package\prepare.py "%RUNNER_TEMP%\HollowwakePrivateInputs\6.21" "%RUNNER_TEMP%\HollowwakePrivatePrepared"
          if errorlevel 1 exit /b 1
          powershell -NoProfile -File hollowwake\native-client-0.5.0\Build.ps1 -OutputDirectory "%RUNNER_TEMP%\HollowwakePrivatePackage" -PrivatePreparedDirectory "%RUNNER_TEMP%\HollowwakePrivatePrepared"
      - name: Encrypt private client delivery for the authorized recipient
        id: private_encrypt
        if: ${{ steps.private_source.outcome == 'success' }}
        shell: pwsh
        run: |
          ./hollowwake/native-client-0.5.0/private-package/Export-EncryptedDelivery.ps1 -InputDirectory "$env:RUNNER_TEMP/HollowwakePrivatePackage" -OutputDirectory "$env:RUNNER_TEMP/HollowwakeEncryptedDelivery" -RecipientPublicKey './hollowwake/native-client-0.5.0/private-package/delivery-recipient-public.pem'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ steps.private_source.outcome == 'success' }}
        with:
          name: hollowwake-private-client-recipient-encrypted
          path: ${{ runner.temp }}/HollowwakeEncryptedDelivery/
          if-no-files-found: error
          retention-days: 3
      - name: Record public and private outcomes separately
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts/native-client-050|Out-Null
          @{audioBehavior='${{ steps.audio_behavior.outcome }}';audioProvider='${{ steps.audio_candidate.outcome }}';mesaProvider='${{ steps.mesa_candidate.outcome }}';fullContentPackage='${{ steps.full_content.outcome }}';fullEncryptedDelivery='${{ steps.full_encrypt.outcome }}';neoDependencySignature='${{ steps.neo_dependency.outcome }}';publicPackage='${{ steps.public_build.outcome }}';privateInputPackaging='${{ steps.private_source.outcome }}';recipientEncryptedDelivery='${{ steps.private_encrypt.outcome }}';plaintextGameFilesInPublicDownload=$false;originalClientExecuted=$false;xboxTested=$false}|ConvertTo-Json|Set-Content artifacts/native-client-050/workflow-outcomes.json
          $audit=Join-Path $env:RUNNER_TEMP 'HollowwakePrivatePackage/private-package-audit.json'
          if(Test-Path $audit){Copy-Item $audit artifacts/native-client-050/private-package-audit.json}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hollowwake-native-client-050-x64
          path: |
            artifacts/native-client-050/**/*.json
            artifacts/native-client-050/**/*.log
            artifacts/native-client-050/native-imports-unresolved.txt
          retention-days: 3
      - name: Reject requested provider compilation failures
        if: ${{ always() && ((contains(github.event.head_commit.message, '[audio-uwp]') && steps.audio_candidate.outcome != 'success') || (contains(github.event.head_commit.message, '[mesa-uwp]') && steps.mesa_candidate.outcome != 'success')) }}
        shell: powershell
        run: throw 'Requested provider candidate did not compile. Inspect per-provider outcome and logs; no compatibility success is claimed.'

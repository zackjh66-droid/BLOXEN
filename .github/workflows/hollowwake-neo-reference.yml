name: Hollowwake exact Neo reference runtime inspection
on:
  push:
    branches: ['hollowwake/native-system-route']
    paths: ['hollowwake/neo-runtime-inspection/**', '.github/workflows/hollowwake-neo-reference.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  group: hollowwake-neo-reference-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Fetch only owned observer source from the triggering public commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($file in @('Run-NeoReference.ps1','Protect-NeoEvidence.ps1','recipient-public.pem')) {
            $url='https://raw.githubusercontent.com/'+$env:GITHUB_REPOSITORY+'/'+$env:GITHUB_SHA+'/hollowwake/neo-runtime-inspection/'+$file
            Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile (Join-Path $env:RUNNER_TEMP $file)
          }
      - name: Open reference and retain session for user device linking
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $args='-NoProfile -ExecutionPolicy RemoteSigned -File "'+$env:RUNNER_TEMP+'/Run-NeoReference.ps1" -OutputDirectory "'+$env:RUNNER_TEMP+'/NeoReferenceEvidence" -MaximumSeconds 1800'
          $p=Start-Process powershell.exe -ArgumentList $args -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/neo-observer-private.stdout" -RedirectStandardError "$env:RUNNER_TEMP/neo-observer-private.stderr"
          $p.Id|Set-Content "$env:RUNNER_TEMP/neo-observer.pid"
          $deadline=[DateTime]::UtcNow.AddSeconds(120)
          do {
            Start-Sleep -Seconds 2
            if(@(Get-ChildItem "$env:RUNNER_TEMP/NeoReferencePrivate/screens" -Filter '*.png' -ErrorAction SilentlyContinue).Count){break}
            if(!(Get-Process -Id $p.Id -ErrorAction SilentlyContinue)){break}
          } while([DateTime]::UtcNow-lt $deadline)
      - name: Capture private session evidence 01
        if: always()
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/Protect-NeoEvidence.ps1" -OutputDirectory "$env:RUNNER_TEMP/NeoReferenceEvidence" -PublicKey "$env:RUNNER_TEMP/recipient-public.pem"
      - name: Preserve encrypted session snapshot 01
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neo-reference-live-01
          path: |
            ${{ runner.temp }}/NeoReferenceEvidence/*.json
            ${{ runner.temp }}/NeoReferenceEvidence/*.hwenc
          if-no-files-found: warn
          retention-days: 2
      - name: Capture private session evidence 02
        if: always()
        shell: pwsh
        run: |
          Start-Sleep -Seconds 90
          & "$env:RUNNER_TEMP/Protect-NeoEvidence.ps1" -OutputDirectory "$env:RUNNER_TEMP/NeoReferenceEvidence" -PublicKey "$env:RUNNER_TEMP/recipient-public.pem"

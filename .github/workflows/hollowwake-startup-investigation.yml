name: Hollowwake native startup investigation
on:
  push:
    branches: ['hollowwake/native-system-route']
    paths: ['hollowwake/startup-investigation/**', '.github/workflows/hollowwake-startup-investigation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  investigate:
    if: ${{ !contains(github.event.head_commit.message, '[capture-only]') && !contains(github.event.head_commit.message, '[startup-integrated]') }}
    runs-on: windows-2022
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bounded original executable startup and owned probe validation
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64
          powershell -NoProfile -File hollowwake\startup-investigation\Run-NativeStartup.ps1 -ConvertedOnly -InitializedOnly -OutputDirectory "%GITHUB_WORKSPACE%\artifacts\startup-investigation"
      - name: Preserve numeric startup evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hollowwake-original-native-startup-evidence
          path: |
            artifacts/startup-investigation/*.jsonl
            artifacts/startup-investigation/scope.json
            artifacts/startup-investigation/*-conversion.json
            artifacts/startup-investigation/*-preparation.json
            artifacts/startup-investigation/noentry-preparation.json
            artifacts/startup-investigation/new-section-preparation.json
            artifacts/startup-investigation/noentry-tls-test.log
            artifacts/startup-investigation/*build.log
            artifacts/startup-investigation/input-acquisition.log
          if-no-files-found: error
          retention-days: 3
  capture:
    if: ${{ contains(github.event.head_commit.message, '[capture-only]') }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run original initialization without editing checks or instructions
        id: capture
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64
          powershell -NoProfile -File hollowwake\startup-investigation\Run-InitializedCapture.ps1 -OutputDirectory "%GITHUB_WORKSPACE%\artifacts\startup-capture" -CaptureDirectory "%RUNNER_TEMP%\HollowwakeInitializedCapture"
      - name: Encrypt private initialized-image inputs for existing recipient
        if: ${{ steps.capture.outcome == 'success' }}
        id: encrypt
        shell: pwsh
        run: ./hollowwake/startup-investigation/Export-InitializedCapture.ps1 -InputDirectory "$env:RUNNER_TEMP/HollowwakeInitializedCapture" -OutputDirectory "$env:RUNNER_TEMP/HollowwakeInitializedEncrypted" -RecipientPublicKey './hollowwake/native-client-0.5.0/private-package/delivery-recipient-public.pem'
      - name: Preserve public numeric capture status only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hollowwake-initialization-capture-status
          path: |
            artifacts/startup-capture/*.jsonl
            artifacts/startup-capture/*.log
            artifacts/startup-capture/capture-status.json
          if-no-files-found: error
          retention-days: 3
      - name: Preserve only recipient-encrypted game image
        if: ${{ steps.encrypt.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hollowwake-initialized-client-recipient-encrypted
          path: ${{ runner.temp }}/HollowwakeInitializedEncrypted/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
